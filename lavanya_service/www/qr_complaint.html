{% extends "templates/web.html" %}

{% block page_content %}
<style>
  :root {
    --lv-primary: #1a73e8;
    --lv-primary-dark: #1557b0;
    --lv-bg: #f8f9fa;
    --lv-card-bg: #ffffff;
    --lv-border: #dadce0;
    --lv-text: #202124;
    --lv-text-muted: #5f6368;
    --lv-success: #0d9e5f;
    --lv-error: #d93025;
    --lv-radius: 12px;
  }

  .qr-page {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--lv-text);
  }

  .qr-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .qr-header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    color: var(--lv-primary);
  }

  .qr-header p {
    font-size: 14px;
    color: var(--lv-text-muted);
    margin: 0;
  }

  .qr-form-card {
    background: var(--lv-card-bg);
    border: 1px solid var(--lv-border);
    border-radius: var(--lv-radius);
    padding: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .qr-field {
    margin-bottom: 18px;
  }

  .qr-field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--lv-text);
  }

  .qr-field label .req {
    color: var(--lv-error);
    margin-left: 2px;
  }

  .qr-field input,
  .qr-field select,
  .qr-field textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--lv-border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s;
    box-sizing: border-box;
    background: var(--lv-bg);
  }

  .qr-field input:focus,
  .qr-field select:focus,
  .qr-field textarea:focus {
    border-color: var(--lv-primary);
    box-shadow: 0 0 0 2px rgba(26,115,232,.15);
  }

  .qr-field textarea {
    min-height: 100px;
    resize: vertical;
  }

  .qr-optional-toggle {
    text-align: center;
    margin: 8px 0 18px;
  }

  .qr-optional-toggle button {
    background: none;
    border: none;
    color: var(--lv-primary);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    text-decoration: underline;
    padding: 4px 8px;
  }

  .qr-optional-fields {
    display: none;
    border-top: 1px solid var(--lv-border);
    padding-top: 18px;
    margin-top: 8px;
  }

  .qr-optional-fields.visible {
    display: block;
  }

  .qr-submit-btn {
    display: block;
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--lv-primary);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    margin-top: 8px;
  }

  .qr-submit-btn:hover {
    background: var(--lv-primary-dark);
  }

  .qr-submit-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .qr-message {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }

  .qr-message.success {
    display: block;
    background: #e6f4ea;
    color: var(--lv-success);
    border: 1px solid #a8dab5;
  }

  .qr-message.error {
    display: block;
    background: #fce8e6;
    color: var(--lv-error);
    border: 1px solid #f5c6cb;
  }

  .qr-success-card {
    display: none;
    text-align: center;
    padding: 40px 24px;
  }

  .qr-success-card .tick {
    font-size: 52px;
    margin-bottom: 12px;
  }

  .qr-success-card h2 {
    font-size: 20px;
    font-weight: 600;
    color: var(--lv-success);
    margin: 0 0 10px;
  }

  .qr-success-card p {
    font-size: 14px;
    color: var(--lv-text-muted);
    margin: 0 0 6px;
  }

  .qr-success-card .ref {
    font-family: monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--lv-text);
    margin-top: 16px;
  }
</style>

<div class="qr-page">
  <div class="qr-header">
    <h1>Lavanya eMart</h1>
    <p>Complaint Registration</p>
  </div>

  <!-- Form Card -->
  <div class="qr-form-card" id="qr-form-card">
    <form id="qr-complaint-form" onsubmit="return false;">

      <!-- Honeypot: hidden from real users; bots that fill it are dropped. -->
      <div class="qr-hp" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;height:0;width:0;overflow:hidden;">
        <label>Company Name</label>
        <input type="text" id="qr-company-name" name="company_name" tabindex="-1" autocomplete="off">
      </div>

      <div class="qr-field">
        <label>Customer Name <span class="req">*</span></label>
        <input type="text" id="qr-customer-name" maxlength="200" required
               placeholder="Enter your full name">
      </div>

      <div class="qr-field">
        <label>Mobile Number <span class="req">*</span></label>
        <input type="tel" id="qr-mobile" maxlength="15" required
               placeholder="10-digit mobile number">
      </div>

      <div class="qr-field">
        <label>Product Type <span class="req">*</span></label>
        <select id="qr-product-type" required>
          <option value="">Select product type</option>
        </select>
      </div>

      <div class="qr-field">
        <label>Brand <span class="req">*</span></label>
        <select id="qr-brand" required>
          <option value="">Select brand</option>
        </select>
      </div>

      <div class="qr-field">
        <label>Complaint Details <span class="req">*</span></label>
        <textarea id="qr-complaint-details" maxlength="2000" required
                  placeholder="Describe your complaint"></textarea>
      </div>

      <div class="qr-field">
        <label>Complaint Type</label>
        <select id="qr-ticket-type">
          <option value="Customer Complaint - Site">Product Complaint</option>
          <option value="Customer Product at Store">Product at Store</option>
          <option value="Installation / Demo">Installation / Demo</option>
        </select>
      </div>

      <div class="qr-optional-toggle">
        <button type="button" onclick="document.getElementById('qr-optional').classList.toggle('visible'); this.textContent = this.textContent === 'Show optional fields' ? 'Hide optional fields' : 'Show optional fields';">Show optional fields</button>
      </div>

      <div class="qr-optional-fields" id="qr-optional">
        <div class="qr-field">
          <label>Model Number</label>
          <input type="text" id="qr-model-no" maxlength="200" placeholder="e.g. MX-01">
        </div>
        <div class="qr-field">
          <label>Serial Number</label>
          <input type="text" id="qr-serial-no" maxlength="200" placeholder="If available">
        </div>
        <div class="qr-field">
          <label>Address</label>
          <input type="text" id="qr-address" maxlength="200" placeholder="Delivery/service address">
        </div>
        <div class="qr-field">
          <label>Pincode</label>
          <input type="text" id="qr-pincode" maxlength="10" placeholder="e.g. 673001">
        </div>
        <div class="qr-field">
          <label>Preferred Callback Time</label>
          <input type="text" id="qr-callback-time" maxlength="200" placeholder="e.g. Morning 10-12">
        </div>
      </div>

      <button type="submit" class="qr-submit-btn" id="qr-submit-btn">Submit Complaint</button>
    </form>

    <div class="qr-message" id="qr-message"></div>
  </div>

  <!-- Success Card (shown after submit) -->
  <div class="qr-form-card qr-success-card" id="qr-success-card">
    <div class="tick">✅</div>
    <h2>Complaint Registered</h2>
    <p>Lavanya team will contact you shortly.</p>
    <p class="ref" id="qr-ref"></p>
    <p style="margin-top:20px;font-size:13px;color:var(--lv-text-muted);">You may close this page.</p>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('qr-complaint-form');
  var btn = document.getElementById('qr-submit-btn');
  var msgEl = document.getElementById('qr-message');

  // Populate Brand / Product Type / Complaint Type from the safe public
  // options endpoint so the form can only submit server-recognised values.
  function fillSelect(el, values) {
    if (!el || !values) return;
    values.forEach(function(v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      el.appendChild(opt);
    });
  }

  fetch('/api/method/lavanya_service.api.qr_intake.get_qr_intake_options', {
    method: 'GET',
    headers: { 'Accept': 'application/json' }
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var opts = (data && data.message) || {};
      fillSelect(document.getElementById('qr-product-type'), opts.product_types);
      fillSelect(document.getElementById('qr-brand'), opts.brands);
    })
    .catch(function() { /* selects keep their placeholder; submit will be validated server-side */ });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    msgEl.className = 'qr-message';
    msgEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    var payload = {
      customer_name: document.getElementById('qr-customer-name').value.trim(),
      mobile: document.getElementById('qr-mobile').value.trim(),
      product_type: document.getElementById('qr-product-type').value.trim(),
      brand: document.getElementById('qr-brand').value.trim(),
      complaint_details: document.getElementById('qr-complaint-details').value.trim(),
      ticket_type: document.getElementById('qr-ticket-type').value,
      model_no: document.getElementById('qr-model-no').value.trim(),
      serial_no: document.getElementById('qr-serial-no').value.trim(),
      address: document.getElementById('qr-address').value.trim(),
      pincode: document.getElementById('qr-pincode').value.trim(),
      preferred_callback_time: document.getElementById('qr-callback-time').value.trim(),
      company_name: document.getElementById('qr-company-name').value.trim()
    };

    fetch('/api/method/lavanya_service.api.qr_intake.submit_qr_complaint', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Frappe-CSRF-Token': (window.frappe && frappe.csrf_token) || 'none'
      },
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.message && data.message.ok) {
        document.getElementById('qr-form-card').style.display = 'none';
        var successCard = document.getElementById('qr-success-card');
        successCard.style.display = 'block';
        document.getElementById('qr-ref').textContent = 'Reference: ' + data.message.reference;
      } else {
        var errMsg = 'Something went wrong. Please try again.';
        if (data._server_messages) {
          try {
            var msgs = JSON.parse(data._server_messages);
            var parsed = JSON.parse(msgs[0]);
            errMsg = parsed.message || errMsg;
          } catch(ex) {
            errMsg = data._server_messages;
          }
        } else if (data.exc_type) {
          errMsg = 'Validation failed. Please check your details.';
        }
        msgEl.className = 'qr-message error';
        msgEl.textContent = errMsg;
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Complaint';
      }
    })
    .catch(function(err) {
      msgEl.className = 'qr-message error';
      msgEl.textContent = 'Network error. Please try again.';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Complaint';
    });
  });
})();
</script>
{% endblock %}
