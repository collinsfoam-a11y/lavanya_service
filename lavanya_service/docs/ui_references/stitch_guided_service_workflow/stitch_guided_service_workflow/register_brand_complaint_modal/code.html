<body class="bg-background text-on-background font-body-default min-h-screen relative overflow-hidden">
<!-- Background Context (Dimmed Ticket Detail Screen) -->
<div class="absolute inset-0 bg-no-repeat bg-cover bg-center pointer-events-none opacity-50 blur-sm" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBKSYA-olb00kMYWoxHYiov2q2HGk7aVqKwRb6Jl2I4-7SSnAxrd0bvCREU-9ozpWrfEB-OWBiRhIFQWQdDwcfp3GWnXRJJlchsoHk6hcxKI8KLEDCB-1I2d4lNuVdifQMHCMHr0Q0KHuTgebKKeN6cmmViItQDLOk5CrKuzWmCxyyIwt3uFWafjejl2p3BqxZXPwhJQNlQT-O8DqWptcinOVidsr6CNUq9W62PApa6VuT-U1K2Xudmieu76BWq894_-WH18uTuWvY');"></div>
<div class="absolute inset-0 bg-on-background/40 pointer-events-none"></div>
<!-- Modal Container (Level 3 Elevation) -->
<div class="relative z-10 flex items-center justify-center min-h-screen p-lg">
<div class="bg-surface w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col border border-outline-variant">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
<h2 class="font-section-title text-section-title text-on-background">Register Brand Complaint</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-xs rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Form) -->
<div class="p-lg flex flex-col gap-md">
<!-- Field: Brand Ticket Number -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface-variant flex items-center gap-xs" for="brandTicket">
                        Brand Ticket Number <span class="text-error">*</span>
</label>
<input class="h-10 px-sm border border-outline-variant rounded bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-default text-body-default text-on-background placeholder:text-outline transition-all" id="brandTicket" placeholder="e.g. BR-84920" required="" type="text"/>
</div>
<!-- Field: Registration Date -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface-variant" for="regDate">
                        Registration Date
                    </label>
<div class="relative">
<input class="w-full h-10 pl-sm pr-[36px] border border-outline-variant rounded bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-default text-body-default text-on-background transition-all appearance-none" id="regDate" type="date" value="2023-10-27"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Field: Expected Resolution Date -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface-variant" for="resDate">
                        Expected Resolution Date
                    </label>
<div class="relative">
<input class="w-full h-10 pl-sm pr-[36px] border border-outline-variant rounded bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-default text-body-default text-on-background transition-all appearance-none" id="resDate" type="date"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="event">event</span>
</div>
</div>
<!-- Info Tip -->
<div class="mt-sm p-sm rounded bg-secondary-fixed/50 border border-secondary-fixed flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-[2px]" data-icon="info" data-weight="fill" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-caption text-caption text-on-surface-variant">Status will update to <strong class="text-primary-fixed-variant">Brand Registered</strong> upon confirmation.</p>
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container-lowest flex justify-end gap-sm items-center">
<button class="px-md h-10 rounded border border-outline-variant bg-surface text-on-background font-button-text text-button-text hover:bg-surface-container-low transition-colors active:scale-95 duration-100" type="button">
                    Cancel
                </button>
<button class="px-md h-10 rounded bg-primary text-on-primary font-button-text text-button-text hover:bg-primary/90 transition-colors active:scale-95 duration-100 shadow-sm flex items-center gap-xs" type="button">
                    Confirm Registration
                </button>
</div>
</div>
</div>
<script>
        // Set today's date automatically for the Registration Date field if it wasn't hardcoded above
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const regDateInput = document.getElementById('regDate');
            if(regDateInput && !regDateInput.value) {
                regDateInput.value = today;
            }
            
            // Simple interaction for modal closing (visual only)
            const closeBtn = document.querySelector('button[aria-label="Close modal"]');
            const cancelBtn = document.querySelector('button:contains("Cancel")');
            
            const closeModal = () => {
                const modal = document.querySelector('.z-10');
                modal.style.opacity = '0';
                modal.style.transform = 'scale(0.95)';
                modal.style.transition = 'all 0.2s ease-in-out';
                setTimeout(() => {
                    // In a real app, this would remove the modal from DOM or navigate back
                    console.log('Modal closed');
                }, 200);
            };

            if(closeBtn) closeBtn.addEventListener('click', closeModal);
            
            // Helper to find button by text content for the vanilla JS snippet
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                if(btn.textContent.trim() === 'Cancel') {
                    btn.addEventListener('click', closeModal);
                }
                if(btn.textContent.trim() === 'Confirm Registration') {
                     btn.addEventListener('click', () => {
                        const btnText = btn.textContent;
                        btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Processing...';
                        btn.disabled = true;
                        setTimeout(() => {
                            closeModal();
                        }, 1000);
                     });
                }
            });
        });
    </script>
