<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ServiceDesk Pro - Close Ticket</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#3c475a",
                        "surface-container-high": "#ece6f4",
                        "error-container": "#ffdad6",
                        "surface": "#fdf7ff",
                        "tertiary-container": "#a84900",
                        "on-tertiary-fixed": "#331100",
                        "inverse-primary": "#ccbeff",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#cac3d9",
                        "surface-tint": "#6533ed",
                        "primary-container": "#6d3df5",
                        "surface-dim": "#ded7e6",
                        "on-primary-fixed": "#1f0060",
                        "on-primary-container": "#e9e0ff",
                        "tertiary-fixed": "#ffdbca",
                        "error": "#ba1a1a",
                        "secondary-container": "#d5e0f8",
                        "secondary-fixed": "#d8e3fb",
                        "surface-bright": "#fdf7ff",
                        "on-secondary-container": "#586377",
                        "surface-container-low": "#f7f1ff",
                        "inverse-surface": "#322f3a",
                        "surface-container": "#f2ebfa",
                        "on-secondary-fixed": "#111c2d",
                        "on-background": "#1c1a24",
                        "secondary": "#545f73",
                        "primary": "#5412dd",
                        "on-primary-fixed-variant": "#4d00d2",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#494456",
                        "secondary-fixed-dim": "#bcc7de",
                        "primary-fixed": "#e7deff",
                        "tertiary-fixed-dim": "#ffb690",
                        "tertiary": "#823700",
                        "on-tertiary-fixed-variant": "#783200",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f5eefd",
                        "background": "#fdf7ff",
                        "primary-fixed-dim": "#ccbeff",
                        "on-surface": "#1c1a24",
                        "outline": "#7a7487",
                        "surface-variant": "#e6e0ef",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e6e0ef",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#ffddcd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "sm": "8px",
                        "base": "8px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "section-title": ["Inter"],
                        "caption": ["Inter"],
                        "button-text": ["Inter"],
                        "body-default": ["Inter"],
                        "page-title": ["Inter"],
                        "field-label": ["Inter"],
                        "display-metrics": ["Inter"]
                    },
                    "fontSize": {
                        "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "button-text": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-default": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "page-title": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "field-label": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "display-metrics": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-default text-body-default min-h-screen relative overflow-hidden">
<!-- Blurred Background (Simulated Ticket Detail View) -->
<div class="absolute inset-0 bg-surface-container-low opacity-50 blur-sm pointer-events-none p-lg flex flex-col gap-lg">
<div class="h-16 bg-surface-container-highest rounded-lg w-full"></div>
<div class="flex gap-lg h-full">
<div class="w-1/3 bg-surface-container-highest rounded-lg h-full"></div>
<div class="w-2/3 bg-surface-container-highest rounded-lg h-full"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/40 flex items-center justify-center p-md z-50 backdrop-blur-[2px]">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg w-full max-w-2xl overflow-hidden border border-outline-variant flex flex-col max-h-[921px]">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-surface">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-xl">check_circle</span>
<h2 class="font-section-title text-section-title text-on-surface">Close Ticket &amp; Resolve</h2>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors p-xs rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Area (Scrollable) -->
<div class="px-lg py-lg overflow-y-auto flex-1 flex flex-col gap-md">
<!-- Info Box -->
<div class="bg-error-container/20 border border-error-container rounded-lg p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-error mt-xs">info</span>
<div>
<p class="font-field-label text-field-label text-on-error-container font-semibold mb-xs">Warning</p>
<p class="font-body-default text-body-default text-on-surface-variant">Ensure all final checks are completed before closing. This action is permanent.</p>
</div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-md mt-sm">
<!-- Closure Type -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface" for="closure-type">Closure Type</label>
<div class="relative">
<select class="w-full h-[40px] appearance-none bg-surface-container-lowest border border-outline-variant rounded px-md font-body-default text-body-default text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="closure-type">
<option disabled="" selected="" value="">Select an option...</option>
<option value="repaired">Repaired</option>
<option value="replaced">Replaced</option>
<option value="cancelled">Cancelled</option>
<option value="refunded">Refunded</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Work Narration -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface" for="work-narration">Work Narration</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded p-md font-body-default text-body-default text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none" id="work-narration" placeholder="Detail the steps taken to resolve this ticket..." rows="5"></textarea>
</div>
<!-- Final Closure Date -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface" for="closure-date">Final Closure Date</label>
<div class="relative">
<input class="w-full h-[40px] bg-surface-container-lowest border border-outline-variant rounded px-md font-body-default text-body-default text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="closure-date" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Customer Confirmation Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<input class="mt-xs w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" id="customer-confirm" type="checkbox"/>
<label class="font-body-default text-body-default text-on-surface-variant cursor-pointer select-none" for="customer-confirm">
                            I have confirmed delivery/satisfaction with the customer.
                        </label>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container flex items-center justify-end gap-sm">
<button class="px-md py-sm rounded border border-outline-variant bg-surface-container-lowest text-on-surface font-button-text text-button-text hover:bg-surface-variant transition-colors" type="button">
                    Cancel
                </button>
<button class="px-md py-sm rounded bg-primary text-on-primary font-button-text text-button-text hover:bg-on-primary-fixed-variant transition-colors shadow-sm flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">done_all</span>
                    Complete Closure
                </button>
</div>
</div>
</div>
</body></html>
