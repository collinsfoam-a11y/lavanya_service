<body class="bg-background text-on-background min-h-screen relative overflow-hidden">
<!-- Background Screen -->
<div class="absolute inset-0 z-0 opacity-40 grayscale blur-[2px] pointer-events-none bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAShQg-guJeHDQd1KUJIzhU59kzsaESsLxnrTjM8SdgLT2r1vXxjAknUU4ChFxXswG_T4WlMrm7sOmJCSZr4tupiaHXk6pUVe5WUJgvtKAsBY_6PNiI8G5xPBPUr0ay6jvKcVDCd4oW5xFJ0KJNDRS0WQqgi0TImYsa7nifvL3_XkVMHzpzxtAH7PYDy-CI8MPXEAxPrS8K2soavTrr_nv3IgLHRU3qT-yWbQa9KMAk-Q9c95koAj4942MacEswOgKE7OMIfDas_fE');"></div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-on-background/40 backdrop-blur-sm p-md">
<!-- Modal Container -->
<div class="bg-surface w-full max-w-2xl rounded-xl shadow-lg border border-outline-variant overflow-hidden flex flex-col relative transform transition-all shadow-[0_8px_30px_rgb(0,0,0,0.12)]">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-surface">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
</div>
<div>
<h2 class="font-section-title text-section-title text-on-background">Service Center Follow-up</h2>
<p class="font-caption text-caption text-on-surface-variant mt-xs">Transition from Brand Registered to In Progress</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-background transition-colors p-xs rounded-full hover:bg-surface-container-highest">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex-1 overflow-y-auto">
<form class="space-y-md">
<!-- Contacted Person -->
<div class="flex flex-col gap-sm">
<label class="font-field-label text-field-label text-on-surface-variant" for="contactedPerson">Contacted Person</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-[40px] pl-10 pr-sm py-sm bg-surface border border-outline-variant rounded text-body-default font-body-default text-on-background focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder-outline" id="contactedPerson" placeholder="Enter name of service center contact" type="text"/>
</div>
</div>
<!-- Internal Status Dropdown -->
<div class="flex flex-col gap-sm">
<label class="font-field-label text-field-label text-on-surface-variant" for="internalStatus">Internal Status</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="build_circle">build_circle</span>
<select class="w-full h-[40px] pl-10 pr-lg py-sm bg-surface border border-outline-variant rounded text-body-default font-body-default text-on-background focus:ring-2 focus:ring-primary focus:border-primary transition-shadow appearance-none" id="internalStatus">
<option disabled="" selected="" value="">Select current phase...</option>
<option value="parts">Parts Awaiting</option>
<option value="repair">In Repair</option>
<option value="testing">Testing</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Revised Completion Date -->
<div class="flex flex-col gap-sm">
<label class="font-field-label text-field-label text-on-surface-variant" for="revisedDate">Revised Completion Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="calendar_today">calendar_today</span>
<input class="w-full h-[40px] pl-10 pr-sm py-sm bg-surface border border-outline-variant rounded text-body-default font-body-default text-on-background focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="revisedDate" type="date"/>
</div>
</div>
<!-- Current Update Text Area -->
<div class="flex flex-col gap-sm pt-sm">
<label class="font-field-label text-field-label text-on-surface-variant" for="currentUpdate">Current Update</label>
<textarea class="w-full p-sm bg-surface border border-outline-variant rounded text-body-default font-body-default text-on-background focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder-outline resize-y min-h-[100px]" id="currentUpdate" placeholder="Provide a detailed summary of the conversation and next steps..." rows="4"></textarea>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-lg py-md bg-surface-container-low border-t border-outline-variant flex items-center justify-end gap-md">
<button class="font-button-text text-button-text text-on-background bg-surface border border-outline-variant h-[40px] px-lg rounded hover:bg-surface-container-highest transition-colors" type="button">
                    Cancel
                </button>
<button class="font-button-text text-button-text text-on-primary bg-primary h-[40px] px-lg rounded hover:bg-primary-fixed-variant transition-colors flex items-center gap-sm" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="update">update</span>
                    Update Ticket
                </button>
</div>
</div>
</div>
</body></html>
