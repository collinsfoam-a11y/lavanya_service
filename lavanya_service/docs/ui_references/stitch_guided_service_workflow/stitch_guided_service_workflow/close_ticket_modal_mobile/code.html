<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Close Ticket &amp; Resolve</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e6e0ef",
                        "surface-bright": "#fdf7ff",
                        "surface": "#fdf7ff",
                        "tertiary": "#823700",
                        "surface-container": "#f2ebfa",
                        "tertiary-fixed-dim": "#ffb690",
                        "outline-variant": "#cac3d9",
                        "primary-container": "#6d3df5",
                        "surface-dim": "#ded7e6",
                        "primary": "#5412dd",
                        "on-secondary-fixed-variant": "#3c475a",
                        "surface-container-low": "#f7f1ff",
                        "on-tertiary-fixed-variant": "#783200",
                        "tertiary-container": "#a84900",
                        "secondary-container": "#d5e0f8",
                        "on-error-container": "#93000a",
                        "background": "#fdf7ff",
                        "on-primary-fixed-variant": "#4d00d2",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d8e3fb",
                        "outline": "#7a7487",
                        "inverse-surface": "#322f3a",
                        "on-background": "#1c1a24",
                        "on-surface-variant": "#494456",
                        "surface-tint": "#6533ed",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdbca",
                        "primary-fixed": "#e7deff",
                        "on-secondary-container": "#586377",
                        "primary-fixed-dim": "#ccbeff",
                        "surface-variant": "#e6e0ef",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1c1a24",
                        "on-secondary": "#ffffff",
                        "secondary": "#545f73",
                        "on-primary-container": "#e9e0ff",
                        "surface-container-high": "#ece6f4",
                        "inverse-on-surface": "#f5eefd",
                        "secondary-fixed-dim": "#bcc7de",
                        "inverse-primary": "#ccbeff",
                        "on-tertiary-container": "#ffddcd",
                        "on-tertiary-fixed": "#331100",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#111c2d",
                        "on-primary-fixed": "#1f0060",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "sheet": "1.5rem"
                    },
                    spacing: {
                        "xl": "32px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "8px",
                        "sm": "8px"
                    },
                    fontFamily: {
                        "button-text": ["Inter", "sans-serif"],
                        "section-title": ["Inter", "sans-serif"],
                        "caption": ["Inter", "sans-serif"],
                        "page-title": ["Inter", "sans-serif"],
                        "display-metrics": ["Inter", "sans-serif"],
                        "body-default": ["Inter", "sans-serif"],
                        "field-label": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "button-text": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "section-title": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "page-title": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-metrics": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "field-label": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .bottom-sheet-enter {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background relative overflow-hidden">
<!-- Simulated background content -->
<div class="p-container-margin filter blur-sm transition-all duration-300 opacity-60">
<header class="flex items-center justify-between mb-lg">
<h1 class="font-page-title text-page-title text-on-surface">Ticket #INC-0982</h1>
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</header>
<div class="bg-surface-container-lowest p-md rounded-lg shadow-sm border border-outline-variant mb-gutter">
<p class="font-body-default text-body-default text-on-surface-variant">Loading ticket details...</p>
</div>
</div>
<!-- Overlay -->
<div class="fixed inset-0 bg-inverse-surface/40 z-40 transition-opacity duration-300"></div>
<!-- Bottom Sheet -->
<div class="fixed bottom-0 left-0 right-0 w-full max-h-[795px] bg-surface-container-lowest rounded-t-sheet z-50 flex flex-col shadow-[0_-8px_30px_rgba(0,0,0,0.12)] bottom-sheet-enter">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-md pb-xs">
<div class="w-12 h-[4px] bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-container-margin pb-md pt-sm flex items-center justify-between border-b border-outline-variant">
<h2 class="font-section-title text-section-title text-on-surface">Close Ticket &amp; Resolve</h2>
<button aria-label="Close" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-container-margin py-lg overflow-y-auto flex-1 flex flex-col gap-gutter">
<!-- Closure Type Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface-variant" for="closure-type">Closure Type</label>
<div class="relative">
<select class="w-full h-[40px] px-sm bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-default text-body-default text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="closure-type">
<option disabled="" selected="" value="">Select reason for closure...</option>
<option value="resolved">Resolved - Issue fixed</option>
<option value="workaround">Resolved - Workaround provided</option>
<option value="duplicate">Duplicate ticket</option>
<option value="user_error">User Error / Training needed</option>
<option value="not_reproducible">Not Reproducible</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Work Narration Textarea -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface-variant" for="work-narration">Work Narration</label>
<textarea class="w-full p-sm bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-default text-body-default text-on-surface resize-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="work-narration" placeholder="Describe the actions taken to resolve this issue..." rows="4"></textarea>
</div>
<!-- Final Closure Date -->
<div class="flex flex-col gap-xs">
<label class="font-field-label text-field-label text-on-surface-variant" for="closure-date">Final Closure Date</label>
<div class="relative">
<input class="w-full h-[40px] px-sm bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-default text-body-default text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="closure-date" type="date"/>
</div>
</div>
<!-- Confirmation Checkbox -->
<div class="flex items-start gap-sm mt-sm pt-sm border-t border-surface-container-highest">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2 transition-all cursor-pointer" id="confirmation" type="checkbox"/>
</div>
<label class="font-body-default text-body-default text-on-surface cursor-pointer select-none" for="confirmation">
                    Confirmed delivery/satisfaction with the customer.
                </label>
</div>
</div>
<!-- Action Buttons Pinned to Bottom -->
<div class="px-container-margin py-md bg-surface-container-lowest border-t border-outline-variant flex flex-col gap-sm safe-area-bottom">
<button class="w-full h-[44px] bg-primary text-on-primary font-button-text text-button-text rounded-DEFAULT flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-sm">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
                Complete Closure
            </button>
<button class="w-full h-[44px] bg-surface-container-lowest text-secondary font-button-text text-button-text border border-outline-variant rounded-DEFAULT flex items-center justify-center active:bg-surface-container transition-colors">
                Cancel
            </button>
</div>
</div>
</body></html>
