<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Request Missing Invoice Modal</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#545f73",
                    "on-secondary-fixed": "#111c2d",
                    "surface-container-highest": "#e6e0ef",
                    "inverse-on-surface": "#f5eefd",
                    "primary-fixed-dim": "#ccbeff",
                    "outline": "#7a7487",
                    "surface-dim": "#ded7e6",
                    "tertiary-fixed": "#ffdbca",
                    "on-secondary-container": "#586377",
                    "tertiary-fixed-dim": "#ffb690",
                    "surface-container-low": "#f7f1ff",
                    "surface-tint": "#6533ed",
                    "inverse-primary": "#ccbeff",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#322f3a",
                    "error": "#ba1a1a",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#6d3df5",
                    "on-primary-fixed-variant": "#4d00d2",
                    "surface-variant": "#e6e0ef",
                    "on-primary": "#ffffff",
                    "tertiary": "#823700",
                    "on-tertiary-fixed": "#331100",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#494456",
                    "on-secondary": "#ffffff",
                    "background": "#fdf7ff",
                    "primary": "#5412dd",
                    "secondary-fixed": "#d8e3fb",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#f2ebfa",
                    "on-primary-fixed": "#1f0060",
                    "surface-bright": "#fdf7ff",
                    "tertiary-container": "#a84900",
                    "on-primary-container": "#e9e0ff",
                    "surface": "#fdf7ff",
                    "on-secondary-fixed-variant": "#3c475a",
                    "on-background": "#1c1a24",
                    "secondary-fixed-dim": "#bcc7de",
                    "on-surface": "#1c1a24",
                    "error-container": "#ffdad6",
                    "secondary-container": "#d5e0f8",
                    "on-tertiary-fixed-variant": "#783200",
                    "surface-container-high": "#ece6f4",
                    "primary-fixed": "#e7deff",
                    "outline-variant": "#cac3d9",
                    "on-tertiary-container": "#ffddcd"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "lg": "24px",
                    "base": "8px",
                    "md": "16px",
                    "xl": "32px",
                    "container-margin": "24px",
                    "gutter": "16px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "section-title": ["Inter"],
                    "caption": ["Inter"],
                    "button-text": ["Inter"],
                    "display-metrics": ["Inter"],
                    "field-label": ["Inter"],
                    "body-default": ["Inter"],
                    "page-title": ["Inter"]
            },
            "fontSize": {
                    "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "button-text": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "display-metrics": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "field-label": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-default": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "page-title": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-default">
<!-- Background Screen Context -->
<iframe class="absolute inset-0 w-full h-full border-none z-0 grayscale-[20%] opacity-90 pointer-events-none" src="{{DATA:SCREEN:SCREEN_2}}" title="Ticket Detail Screen Context"></iframe>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-50 bg-on-background/40 backdrop-blur-[2px] flex items-center justify-center p-md sm:p-lg transition-opacity duration-300">
<!-- Modal Container (Level 3 Elevation) -->
<div class="bg-surface-container-lowest w-full max-w-[540px] rounded-xl shadow-2xl flex flex-col overflow-hidden border border-outline-variant/30 transform scale-100 transition-transform duration-300">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-outline-variant bg-surface flex justify-between items-center shrink-0">
<h2 class="font-section-title text-section-title text-on-surface">Request Missing Invoice</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest p-xs rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg overflow-y-auto max-h-[716px]">
<!-- Helper Text -->
<div class="flex gap-sm p-md bg-surface-container-low rounded-lg border border-surface-dim">
<span class="material-symbols-outlined text-primary mt-[2px] text-[20px]" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-default text-body-default text-on-surface-variant">
                        The ticket timer will be paused automatically once set to 'Waiting on Customer'. An email notification will be dispatched immediately.
                    </p>
</div>
<!-- Form Fields Container -->
<div class="flex flex-col gap-md">
<!-- Reason Dropdown -->
<div class="flex flex-col gap-sm">
<label class="font-field-label text-field-label text-on-surface" for="request-reason">Reason for Request <span class="text-error">*</span></label>
<div class="relative group">
<select class="w-full h-10 px-md py-0 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-default text-body-default appearance-none focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all cursor-pointer hover:border-outline" id="request-reason">
<option disabled="" hidden="" selected="" value="">Select the discrepancy reason...</option>
<option value="warranty">Warranty Verification Required</option>
<option value="purchase_date">Purchase Date Discrepancy</option>
<option value="illegible">Document Illegible</option>
<option value="missing">Proof of Purchase Missing entirely</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-hover:text-on-surface transition-colors">expand_more</span>
</div>
</div>
<!-- Date Picker & Priority Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-field-label text-field-label text-on-surface" for="follow-up-date">Next Follow-up Date <span class="text-error">*</span></label>
<div class="relative group">
<input class="w-full h-10 pl-md pr-10 py-0 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-default text-body-default focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all hover:border-outline cursor-text [&amp;::-webkit-calendar-picker-indicator]:opacity-0 [&amp;::-webkit-calendar-picker-indicator]:absolute [&amp;::-webkit-calendar-picker-indicator]:w-full [&amp;::-webkit-calendar-picker-indicator]:h-full [&amp;::-webkit-calendar-picker-indicator]:cursor-pointer" id="follow-up-date" type="date"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-hover:text-on-surface transition-colors">calendar_month</span>
</div>
</div>
</div>
<!-- Optional Notes -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-baseline">
<label class="font-field-label text-field-label text-on-surface" for="optional-notes">Optional Notes</label>
<span class="font-caption text-caption text-on-surface-variant">Internal only</span>
</div>
<textarea class="w-full p-md border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-default text-body-default focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all hover:border-outline resize-y min-h-[80px] max-h-[200px]" id="optional-notes" placeholder="Add specific details about what is missing from the submitted document..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-outline-variant bg-surface flex flex-col sm:flex-row justify-end items-center gap-md shrink-0">
<button class="w-full sm:w-auto px-lg h-10 rounded-lg border border-outline-variant bg-surface-container-lowest font-button-text text-button-text text-on-secondary-fixed hover:bg-surface-container-highest focus:ring-2 focus:ring-secondary focus:outline-none transition-all">
                    Cancel
                </button>
<button class="w-full sm:w-auto px-lg h-10 rounded-lg bg-primary font-button-text text-button-text text-on-primary hover:bg-primary-container hover:text-on-primary-container focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface focus:outline-none transition-all shadow-sm">
                    Set to Waiting on Customer
                </button>
</div>
</div>
</div>
</body></html>
